services:
  backend:
    build:
      context: ./back
    env_file:
      - ./back/.env
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./back:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./front
    environment:
      VITE_PORT: 80
    ports:
      - "80:80"
    volumes:
      - ./front:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
